[package]
name = "scry"
version = "0.2.0"
edition = "2021"
description = "Search and cluster project READMEs"
license = "MIT OR Apache-2.0"
# The crates.io name "scry" belongs to another project.
publish = false

[workspace]

[dependencies]
clump = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "io-std"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
ignore = "0.4"

[[bin]]
name = "scry"
path = "src/main.rs"
